services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express_app
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      DB_NAME: ${POSTGRES_DB:-appdb}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    # Comment out the two volume lines below for a production-style image
    # where the app code is baked into the image instead of mounted live.
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge